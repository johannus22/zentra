[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# release.yml intentionally drops the pull_request trigger (CI only runs on
# merge to main, not every PR) -- tell dist not to treat that as drift.
allow-dirty = ["ci"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

# System dependencies the Linux build needs at build time. The keyring
# `sync-secret-service` backend links libdbus (see Cargo.toml), so the Ubuntu
# runner must have the dev headers + pkg-config, mirroring ci.yml.
[dist.dependencies.apt]
"libdbus-1-dev" = "*"
pkg-config = "*"
