name: CI

on:
  # Pull requests as well as main. Without this the matrix only ran after a
  # merge, and merge commits carry `[skip ci]` — so the Linux and macOS builds
  # saw neither the PR nor the merge, and the clippy gate below could only turn
  # main red instead of blocking the change that broke it.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI has no usable OS keychain: macOS shows an interactive "allow access" prompt
  # (hangs headless), Linux has no secret-service daemon. Use the 0600-plaintext
  # fallback so secret_store tests are deterministic. (No effect on Windows/DPAPI.)
  ZENTRA_NO_OS_KEYCHAIN: "1"

jobs:
  test:
    name: test & clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # keyring's sync-secret-service backend links system libdbus on Linux.
      - name: Install libdbus (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install clippy
        run: rustup component add clippy

      # Hard gate. The secret-store (DPAPI / Keychain / Secret-Service), path,
      # and other cfg-gated code differs per OS — and the per-target dependency
      # sets in Cargo.toml only compile on their platform — so a single-OS run
      # would never build or exercise the Windows/macOS/Linux branches.
      - name: Test
        run: cargo test --locked

      # Hard gate. The pre-existing lints this used to tolerate are cleared, so
      # the tree starts clean and a new warning is a build failure rather than a
      # line in a log nobody reads. Findings that were considered and accepted
      # carry a local `#[allow]` with the reason next to the code.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
