name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Temporary, throwaway-branch-only filter: this test PR only adds
    # .github/workflows/zentra.yml, so skip the full test/clippy matrix here.
    # Never merges to main, so main's real CI trigger is unaffected.
    paths-ignore:
      - ".github/workflows/zentra.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI has no usable OS keychain: macOS shows an interactive "allow access" prompt
  # (hangs headless), Linux has no secret-service daemon. Use the 0600-plaintext
  # fallback so secret_store tests are deterministic. (No effect on Windows/DPAPI.)
  ZENTRA_NO_OS_KEYCHAIN: "1"

jobs:
  test:
    name: test & clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # keyring's sync-secret-service backend links system libdbus on Linux.
      - name: Install libdbus (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install clippy
        run: rustup component add clippy

      # Hard gate. The secret-store (DPAPI / Keychain / Secret-Service), path,
      # and other cfg-gated code differs per OS — and the per-target dependency
      # sets in Cargo.toml only compile on their platform — so a single-OS run
      # would never build or exercise the Windows/macOS/Linux branches.
      - name: Test
        run: cargo test --locked

      # Advisory only for now: the tree has ~17 pre-existing clippy lints, so
      # this deliberately omits `-- -D warnings` to avoid a red-on-arrival gate.
      # Once those are cleared, append `-- -D warnings` to make clippy blocking.
      - name: Clippy
        run: cargo clippy --all-targets --locked
