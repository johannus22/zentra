name: Zentra Security

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  zentra-security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install libdbus (Linux)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build Zentra CLI
        run: |
          cargo build --release --locked
          echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"
      - name: Run Zentra CI
        env:
          ZENTRA_API_KEY: ${{ secrets.ZENTRA_API_KEY }}
          ZENTRA_PROVIDER_BASE_URL: ${{ secrets.ZENTRA_PROVIDER_BASE_URL }}
          ZENTRA_PROVIDER_MODEL: ${{ vars.ZENTRA_PROVIDER_MODEL }}
        run: zentra ci
      - name: Upload Zentra CI report
        uses: actions/upload-artifact@v4
        with:
          name: zentra-ci-report
          path: |
            .zentra/ci-report.md
            .zentra/ci-report.json
