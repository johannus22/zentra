[package]
name = "zentra-cli"
version = "0.12.13"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/johannus22/zentra-cli"

[[bin]]
name = "zentra"
path = "src/main.rs"

[lib]
name = "zentra_cli"
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
crossterm = "0.28"
futures = "0.3"
ratatui = "0.29"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
ignore = "0.4"
keyring = "3"
open = "5"
rand = "0.8"
rayon = "1"
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
roxmltree = "0.20"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.8"
totp-rs = { version = "5", features = ["gen_secret", "serde_support"] }
walkdir = "2"
which = "6"
zeroize = "1"

[dev-dependencies]
wiremock = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
] }

# Real OS secret-store backends for the envelope-encryption data key (src/config/secret_store.rs).
# keyring 3.x is a no-op mock unless a backend feature is enabled; on Windows the base
# `keyring = "3"` dep stays featureless (DPAPI is used instead, so the mock is harmless).
# NOTE: in keyring 3.6 `sync-secret-service` = the blocking `dbus-secret-service` backend, which
# links the system libdbus (`libdbus-1-dev` at build time). We use the sync backend deliberately —
# keyring's API is called synchronously from inside the tokio runtime, and the async/zbus backend
# would require block-on-in-runtime. CI installs libdbus-1-dev on Linux (see ci.yml).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
