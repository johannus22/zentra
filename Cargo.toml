[package]
name = "zentra-cli"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "zentra"
path = "src/main.rs"

[lib]
name = "zentra_cli"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
ratatui = "0.29"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
ignore = "0.4"
keyring = "3"
open = "5"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
