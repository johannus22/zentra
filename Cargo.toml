[package]
name = "zentra-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zentra"
path = "src/main.rs"

[lib]
name = "zentra_cli"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
keyring = "3"
reqwest = { version = "0.12", features = ["json"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
