[package]
name = "zentra-cli"
version = "0.16.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/johannus22/zentra"

[[bin]]
name = "zentra"
path = "src/main.rs"

[lib]
name = "zentra_cli"
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
crossterm = "0.29"
futures = "0.3"
ratatui = "0.30.2"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
ignore = "0.4"
keyring-core = "1.0.1"
open = "5"
rand = "0.8"
rayon = "1"
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.8"
which = "6"
zeroize = "1"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
wiremock = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
] }

# Explicit platform stores avoid keyring v3's unused async/zbus dependency chain.
# The Linux store always negotiates DH-encrypted sessions. Keep the blocking
# backend: calls run synchronously inside Tokio. libdbus-1-dev is required.
# The direct backend dependency supports keyring v3's collection-scoped legacy lookup.
[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
dbus-secret-service = { version = "4.1.0", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
